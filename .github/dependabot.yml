version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: main
    labels: [dependencies, python]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: main
    labels: [dependencies, javascript]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    labels: [dependencies, github-actions]
